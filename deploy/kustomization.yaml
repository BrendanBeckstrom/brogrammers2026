# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-brogrammers
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - pdb.yaml
images:
  - name: app
    newName: ghcr.io/brendanbeckstrom/brogrammers2026
    newTag: 9cbe52e

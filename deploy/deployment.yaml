apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  # Remove this line when you turn on the HPA (examples/hpa), or Argo CD and
  # the autoscaler will keep resetting each other.
  # Radar Checks (singleReplica): two pods, so a rollout or a pod failure never
  # takes the site down. Fits the team budget (2 x 100m / 256Mi requests).
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      # Radar Checks (automountServiceAccountToken): the app never calls the
      # Kubernetes API, so don't mount a service-account token into it.
      automountServiceAccountToken: false
      # Radar Checks (missingTopologySpread): prefer putting the two replicas on
      # different nodes, so one node going away doesn't take both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: app
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "brogrammers"
            - name: OTEL_SERVICE_NAME
              value: debrief-api
            # Send metrics every 10 s instead of the SDK's 60 s, so the 1-hour
            # rate()/increase() windows on the Debrief health dashboard hold enough samples.
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "10000"
            - name: LLM_PROVIDER
              value: anthropic
            # From Secret app-credentials, which a person creates by hand (see
            # README, Deploy). Optional, so pods start before it exists. Only the
            # Secret's name goes in git, never a value.
            - name: ELASTIC_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elastic-url
                  optional: true
            - name: ELASTIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elastic-api-key
                  optional: true
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: llm-api-key
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: otel-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: otel-headers
                  optional: true
            # Browser RUM (GET /api/config -> web/src/rum.ts): a Dash0 token limited to
            # "Ingesting". Unset means the browser sends no telemetry.
            - name: DASH0_WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: dash0-web-token
                  optional: true
            - name: DASH0_WEB_ENDPOINT
              value: https://ingress.us-west-2.aws.dash0.com
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Give uvicorn time to bind before the first startup check, avoiding
          # connection-refused warnings. Startup checks then allow up to 60 s
          # before readiness and liveness checks take over.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Radar Checks (readOnlyRootFs): the image is immutable at runtime; only /tmp
          # (an emptyDir) is writable.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi

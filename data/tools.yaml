# Tool dictionary for Debrief (contract: docs/BRIEF.md "Tool dictionary").
#
# Matching (ingest/tag.py): every alias and caption spelling is matched as whole words,
# case-insensitive. Words inside a term may be joined by spaces, hyphens or nothing,
# so "argo cd" also matches "Argo-CD" and "argocd". Plurals are not implied: list them.
#
# Rules:
# - Never use an alias that also names another tool (a bare "argo" is also Argo Workflows).
# - caption_spellings are misheard forms actually seen in YouTube auto-captions of
#   KubeCon talks. Never add one that is ordinary English (e.g. bare "hotel" or
#   "customize"); use a longer phrase instead.
# - packages are real names, used by the stack parser (task 7) to map dependency files
#   (go.mod, package.json, requirements.txt, Chart.yaml) to tools.


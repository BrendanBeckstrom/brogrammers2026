# On every push to main: build the image, push it to GHCR, and publish the
# manifests pointing at it to the `deploy` branch. Argo CD tracks `deploy`.
# main is protected (changes land only through reviewed PRs with green CI),
# so this workflow never commits to main.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only in your copy: the template repo itself keeps its placeholders.
    if: github.repository != 'skyhook-io/cnh-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Publish the manifests to the deploy branch
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `deploy` is always the commit this run built plus one commit that
          # sets the image. Runs are serialized by the concurrency group, so the
          # newest build always wins. Argo CD syncs deploy/ from this branch.
          yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
          git commit -qam "deploy: ${TAG} [skip ci]"
          git push -q --force origin HEAD:refs/heads/deploy

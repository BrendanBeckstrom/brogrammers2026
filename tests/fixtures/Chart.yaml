apiVersion: v2
name: platform-observability
description: Observability and certificates for the platform team's clusters
type: application
version: 0.3.0
dependencies:
  - name: kube-prometheus-stack
    version: 65.1.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: opentelemetry-collector
    version: 0.108.0
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
  - name: cert-manager
    version: v1.16.2
    repository: https://charts.jetstack.io
  # not listed in tools.yaml by name; the jetstack repository identifies cert-manager
  - name: trust-manager
    version: v0.13.0
    repository: https://charts.jetstack.io
  - name: Postgresql
    version: 16.2.1
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: ingress-nginx
    version: 4.11.3
    repository: https://kubernetes.github.io/ingress-nginx
